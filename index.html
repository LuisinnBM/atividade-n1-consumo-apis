<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Informações do País</title>
</head>
<body>
  <h1>Buscar Informações do País e seus autores</h1>
  
  <input type="text" id="country-input" placeholder="Digite o nome do país e pressione Enter">
  <ul id="suggestions"></ul>
  
  <div>
    <img id="country-flag" alt="Bandeira do país" width="200" />
    <p><strong>Nome:</strong> <span id="country-name"></span></p>
    <p><strong>Capital:</strong> <span id="country-capital"></span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
